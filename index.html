<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Jump Game</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: pink;
        }
        #game {
            width: 600px;
            height: 200px;
            margin: auto;
            border: 2px solid black;
            position: relative;
            overflow: hidden;
            background-color: #ffcccb;
            display: none; /* Initially hidden */
        }
        #teddy {
            width: 50px;
            height: 50px;
            position: absolute;
            bottom: 0;
            left: 50px;
            background-image: url('bear.jpg'); /* Updated teddy image */
            background-size: cover;
        }
        .obstacle {
            width: 30px;
            height: 40px;
            position: absolute;
            bottom: 0;
            right: 0;
            background-image: url('nazar.jpg'); /* Updated Nazar image */
            background-size: cover;
        }
        .heart {
            width: 20px;
            height: 20px;
            position: absolute;
            background-image: url('https://i.imgur.com/OQiDoY3.png'); /* Replace with your heart image */
            background-size: cover;
        }
        #message, #score, #distance, #motivation {
            font-size: 20px;
            margin-top: 10px;
        }
        #restart {
            display: none;
            padding: 10px 20px;
            font-size: 16px;
            background-color: red;
            color: white;
            border: none;
            cursor: pointer;
        }
        #start {
            font-size: 30px;
            border: none;
            background: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Never ending as my love is eternal for u</h1>
    <p>Press SPACE to jump over Nazar. Collect hearts for points. Survive as long as possible!</p>
    <button id="start" onclick="startGame()">❤️</button>
    <div id="game">
        <div id="teddy"></div>
    </div>
    <p id="score">Love Score: 0 ❤️</p>
    <p id="distance">Distance: 0m ❤️</p>
    <p id="motivation"></p>
    <p id="message"></p>
    <button id="restart" onclick="restartGame()">Restart</button>
    <p id="continueText" style="display: none;">But you can still play ❤️</p>
    
    <script>
        let teddy = document.getElementById("teddy");
        let game = document.getElementById("game");
        let message = document.getElementById("message");
        let scoreDisplay = document.getElementById("score");
        let distanceDisplay = document.getElementById("distance");
        let motivation = document.getElementById("motivation");
        let restartBtn = document.getElementById("restart");
        let continueText = document.getElementById("continueText");
        let startBtn = document.getElementById("start");
        let jumping = false, score = 0, distance = 0;
        let gameOver = false;

        function startGame() {
            game.style.display = "block";
            startBtn.style.display = "none";
            updateDistance();
            setTimeout(createObstacle, 5000); // Delay obstacles for first 5m
        }

        function jump() {
            if (jumping || gameOver) return;
            jumping = true;
            let up = setInterval(() => {
                let pos = parseInt(window.getComputedStyle(teddy).bottom);
                if (pos >= 100) {
                    clearInterval(up);
                    let down = setInterval(() => {
                        let pos = parseInt(window.getComputedStyle(teddy).bottom);
                        if (pos <= 0) {
                            clearInterval(down);
                            jumping = false;
                        }
                        teddy.style.bottom = (pos - 5) + "px";
                    }, 20);
                }
                teddy.style.bottom = (pos + 5) + "px";
            }, 20);
        }

        function createObstacle() {
            if (gameOver || distance < 5) return; // No obstacles for the first 5m
            let obstacle = document.createElement("div");
            obstacle.classList.add("obstacle");
            game.appendChild(obstacle);
            let move = setInterval(() => {
                let obstaclePos = parseInt(window.getComputedStyle(obstacle).right);
                let teddyBottom = parseInt(window.getComputedStyle(teddy).bottom);
                if (obstaclePos > 600) {
                    clearInterval(move);
                    game.removeChild(obstacle);
                } else {
                    obstacle.style.right = (obstaclePos + 5) + "px";
                    if (obstaclePos > 500 && obstaclePos < 550 && teddyBottom < 40) {
                        endGame();
                    }
                }
            }, 30);
            setTimeout(createObstacle, Math.random() * 3000 + 2000);
        }

        function updateDistance() {
            if (gameOver) return;
            distance++;
            distanceDisplay.innerText = "Distance: " + distance + "m ❤️";
            score++;
            scoreDisplay.innerText = "Love Score: " + score + " ❤️";
            if (distance % 20 === 0) {
                let messages = ["Very good princess!", "Wow love, keep it up!", "My princess is so great at this, I am so proud!"];
                motivation.innerText = messages[Math.floor(Math.random() * messages.length)];
                setTimeout(() => { motivation.innerText = ""; }, 2000);
            }
            setTimeout(updateDistance, 1000);
        }

        function endGame() {
            message.innerText = "Aww, I still love you ❤️";
            restartBtn.style.display = "block";
            continueText.style.display = "block";
            gameOver = true;
        }

        function restartGame() {
            location.reload();
        }

        document.addEventListener("keydown", function (e) { if (e.code === "Space") jump(); });
    </script>
</body>
</html>
